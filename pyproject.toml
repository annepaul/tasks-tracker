[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tracker"
version = "0.1.0"
description = "A simple command-line task tracker"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
tasks = "tasks:main"

[tool.setuptools]
py-modules = ["tasks"]